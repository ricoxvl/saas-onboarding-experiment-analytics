name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m saas_analytics.simulate --users 4000 --seed 42
      - run: python -m saas_analytics.analyze
      - name: Upload reproducible synthetic analytics reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-experiment-reports
          path: reports/generated/
          if-no-files-found: warn
